name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.idea/**'
  workflow_dispatch:

permissions:
  contents: read

# Деплой не параллелится: два образа с одним тегом latest — плохая идея.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    name: Проверки
    uses: ./.github/workflows/test.yml
    with:
      # Образ ниже собирается всерьёз — отдельная проверочная сборка не нужна.
      docker: false

  publish:
    name: Публикация образа
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Логин в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Теги
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: docker build + push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Выкатка
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    # secrets в `if` шага не читается, поэтому секрет заносится в env заранее.
    env:
      WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK_URL }}
    steps:
      # Dokploy тянет образ сам по вебхуку. Секрет не задан — шаг пропускается,
      # образ всё равно опубликован и выкатывается руками.
      - name: Дёрнуть вебхук Dokploy
        if: env.WEBHOOK != ''
        run: curl --fail --silent --show-error --location --request POST "$WEBHOOK"

      # Миграции никогда не применяются при старте приложения — это отдельный
      # шаг деплоя в том же образе:
      #   docker run --rm <image> node dist/cli/migrate.js up
      - name: Напоминание про миграции
        run: |
          {
            echo '### Образ выкачен'
            echo ''
            echo '`ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}`'
            echo ''
            echo 'Миграции применяются отдельным шагом, не при старте:'
            echo ''
            echo '```'
            echo 'docker run --rm <image> node dist/cli/migrate.js up'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
