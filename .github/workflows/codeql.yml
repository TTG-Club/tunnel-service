name: CodeQL

on:
  # В этом репозитории изменения приезжают прямо в main, pull request'ы —
  # редкость. Без триггера на push скан не запускался бы вообще никогда.
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - review_requested
      - auto_merge_enabled

  # Раз в неделю: находит уязвимости в коде, который давно не трогали, и в
  # зависимостях, про которые правила появились уже после коммита.
  schedule:
    - cron: '17 4 * * 1'

  workflow_call:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: CodeQL-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # permissions на уровне job'а ЗАМЕНЯЕТ блок workflow целиком, а не
    # дополняет его. Поэтому здесь его нет: иначе job остался бы без
    # contents: read и checkout не смог бы склонировать репозиторий.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          # Канонический идентификатор языка в CodeQL v3: он покрывает и
          # JavaScript, и TypeScript одним анализом.
          languages: javascript-typescript
          # Сборка для анализа не нужна — CodeQL читает исходники как есть.
          # Отдельный шаг autobuild для JS/TS бесполезен и только добавляет
          # точку отказа.
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
